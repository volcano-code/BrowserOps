name: BrowserOps CI

on:
  push:
    branches: ["main", "browserops/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Unit tests
        run: uv run --no-sync pytest -q
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Pyright
        run: uv run --no-sync pyright
